<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panchayat Grievance Register &amp; Resolution Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tiro+Tamil:ital@0;1&family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

  :root {
    --paper: #F3ECDC;
    --paper-dark: #EAE0C7;
    --ruled-line: #D9CBA6;
    --ink: #1C2B45;
    --ink-soft: #4A5670;
    --margin-red: #8B2A32;
    --seal-gold: #A8823D;
    --ink-amber: #A8641C;
    --ink-blue: #2B5C8A;
    --ink-green: #2F6B44;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
  }

  .flex { display: flex; }
  .flex-wrap { flex-wrap: wrap; }
  .items-center { align-items: center; }
  .justify-center { justify-content: center; }
  .justify-between { justify-content: space-between; }
  .gap-1 { gap: 4px; }
  .gap-2 { gap: 8px; }
  .gap-3 { gap: 12px; }
  .flex-col { flex-direction: column; }
  .hidden { display: none !important; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--ruled-line); border-radius: 4px; }

  header.register-header {
    border-bottom: 3px double var(--ink);
    padding: 28px 24px 20px;
    text-align: center;
  }
  .title-tamil {
    font-family: 'Tiro Tamil', serif;
    font-size: 26px;
  }
  .title-en {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.18em;
    color: var(--ink-soft);
    margin-top: 4px;
    text-transform: uppercase;
  }
  .title-rule {
    width: 120px;
    height: 2px;
    background: var(--seal-gold);
    margin: 12px auto 0;
  }

  .stats-strip {
    padding: 18px 24px;
    gap: 12px;
  }
  .stat-card {
    background: var(--paper-dark);
    border: 1px solid var(--ruled-line);
    border-radius: 4px;
    padding: 10px 18px;
    min-width: 110px;
    flex-direction: column;
    align-items: center;
  }
  .stat-value {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px;
    font-weight: 700;
  }
  .stat-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--ink-soft);
    text-transform: uppercase;
    margin-top: 2px;
  }

  .toolbar { padding: 0 24px 16px; gap: 8px; }
  .search-box {
    background: white;
    border: 1px solid var(--ruled-line);
    border-radius: 4px;
    padding: 8px 10px;
    flex: 1 1 220px;
    gap: 8px;
  }
  .search-box input {
    border: none; outline: none; background: transparent;
    font-size: 13px; flex: 1; color: var(--ink); font-family: 'Inter', sans-serif;
  }
  select, input, textarea { font-family: 'Inter', sans-serif; }
  select {
    border: 1px solid var(--ruled-line);
    border-radius: 4px;
    padding: 8px 10px;
    font-size: 13px;
    background: white;
    color: var(--ink);
  }
  input:focus, select:focus, textarea:focus {
    outline: 2px solid var(--ink-blue); outline-offset: 1px;
  }
  .btn-primary {
    background: var(--margin-red);
    color: white;
    border: none;
    border-radius: 4px;
    padding: 9px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    gap: 4px;
  }
  .btn-primary:hover { filter: brightness(1.08); }

  .register-wrap { padding: 0 24px 40px; }
  .register-table {
    background: white;
    border: 1px solid var(--ruled-line);
    border-radius: 4px;
    overflow: hidden;
  }
  .margin-col {
    width: 34px;
    background: var(--paper-dark);
    border-right: 2px solid var(--margin-red);
    flex-direction: column;
    flex-shrink: 0;
  }
  .margin-col-head { height: 44px; border-bottom: 1px solid var(--ruled-line); }
  .margin-number {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--margin-red);
    height: 68px;
    border-bottom: 1px solid var(--ruled-line);
    justify-content: center;
  }

  .table-scroll { flex: 1; overflow-x: auto; }
  .table-inner { min-width: 640px; }
  .table-head {
    height: 44px;
    border-bottom: 1px solid var(--ruled-line);
    padding: 0 16px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    font-weight: 600;
  }
  .col-gr { width: 110px; }
  .col-name { width: 150px; }
  .col-village { width: 150px; }
  .col-category { width: 150px; }
  .col-status { flex: 1; }
  .col-chevron { width: 24px; color: var(--ink-soft); }

  .ledger-row {
    height: 68px;
    padding: 0 16px;
    border-bottom: 1px solid var(--ruled-line);
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .ledger-row:hover { background: var(--paper-dark); }
  .ledger-row:focus-visible { outline: 2px solid var(--ink-blue); outline-offset: -2px; }

  .cell-gr { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--ink-soft); }
  .cell-name { font-size: 13.5px; font-weight: 500; }
  .cell-village, .cell-category { font-size: 12.5px; color: var(--ink-soft); }

  .priority-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    margin-right: 6px; flex-shrink: 0;
  }
  .priority-high { background: var(--margin-red); }
  .priority-medium { background: var(--ink-amber); }
  .priority-low { background: var(--ink); }

  .stamp {
    display: inline-flex; align-items: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
    padding: 3px 8px; border-radius: 2px; transform: rotate(-2deg);
    opacity: 0.9; white-space: nowrap;
  }
  .stamp-pending { border: 2px solid var(--ink-amber); color: var(--ink-amber); }
  .stamp-progress { border: 2px solid var(--ink-blue); color: var(--ink-blue); }
  .stamp-resolved { border: 2px solid var(--ink-green); color: var(--ink-green); }

  .empty-state {
    padding: 40px 16px; text-align: center; color: var(--ink-soft); font-size: 13px;
  }

  /* Modal / drawer overlay */
  .overlay {
    position: fixed; inset: 0; background: rgba(28,43,69,0.45); z-index: 50;
  }
  .modal-center { align-items: center; justify-content: center; padding: 16px; }

  .modal-card {
    background: var(--paper);
    border: 1px solid var(--ruled-line);
    border-radius: 6px;
    width: 100%; max-width: 480px;
    padding: 24px;
    max-height: 88vh;
    overflow-y: auto;
  }
  .modal-title { font-family: 'Source Serif 4', serif; font-weight: 700; font-size: 17px; }
  .icon-btn {
    background: none; border: none; cursor: pointer; color: var(--ink-soft);
    display: flex; align-items: center;
  }
  .field-label {
    font-size: 12px; color: var(--ink-soft); display: block; margin-bottom: 4px;
  }
  .field-input {
    width: 100%; border: 1px solid var(--ruled-line); border-radius: 4px;
    padding: 8px 10px; font-size: 13px; background: white;
  }
  textarea.field-input { resize: vertical; }

  .drawer {
    position: absolute; top: 0; right: 0; height: 100%; width: min(420px, 100%);
    background: var(--paper); border-left: 3px double var(--ink); padding: 24px; overflow-y: auto;
  }
  .drawer-id { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--margin-red); }
  .drawer-name { font-family: 'Source Serif 4', serif; font-weight: 700; font-size: 19px; margin-bottom: 12px; }
  .drawer-meta { font-size: 13px; color: var(--ink-soft); margin-bottom: 16px; }
  .drawer-meta > div { margin-bottom: 8px; }
  .drawer-desc {
    background: var(--paper-dark); border: 1px solid var(--ruled-line); border-radius: 4px;
    padding: 12px; font-size: 13px; margin-bottom: 20px; line-height: 1.5;
  }
  .status-btn {
    border: 1px solid var(--ruled-line); background: white; color: var(--ink);
    border-radius: 4px; padding: 7px 10px; font-size: 12.5px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .status-btn.active { border-color: var(--ink); background: var(--ink); color: white; }

  svg.icon { flex-shrink: 0; }

  @media (max-width: 560px) {
    .col-village, .col-category { display: none; }
  }
</style>
</head>
<body>

<header class="register-header">
  <div class="title-tamil">பஞ்சாயத்து குறை பதிவேடு</div>
  <div class="title-en">Panchayat Grievance Register &amp; Resolution Tracker</div>
  <div class="title-rule"></div>
</header>

<div class="flex flex-wrap justify-center stats-strip">
  <div class="flex stat-card">
    <div class="stat-value" id="stat-total" style="color: var(--ink);">0</div>
    <div class="stat-label">Total Filed</div>
  </div>
  <div class="flex stat-card">
    <div class="stat-value" id="stat-pending" style="color: var(--ink-amber);">0</div>
    <div class="stat-label">Pending</div>
  </div>
  <div class="flex stat-card">
    <div class="stat-value" id="stat-progress" style="color: var(--ink-blue);">0</div>
    <div class="stat-label">In Progress</div>
  </div>
  <div class="flex stat-card">
    <div class="stat-value" id="stat-resolved" style="color: var(--ink-green);">0</div>
    <div class="stat-label">Resolved</div>
  </div>
  <div class="flex stat-card">
    <div class="stat-value" id="stat-rate" style="color: var(--seal-gold);">0%</div>
    <div class="stat-label">Resolution Rate</div>
  </div>
</div>

<div class="flex flex-wrap items-center toolbar">
  <div class="flex items-center search-box">
    <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#4A5670" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="search-input" placeholder="Search by name, village or GR number..." />
  </div>

  <select id="status-filter">
    <option value="All">All Statuses</option>
    <option value="Pending">Pending</option>
    <option value="In Progress">In Progress</option>
    <option value="Resolved">Resolved</option>
  </select>

  <select id="category-filter">
    <option value="All">All Categories</option>
  </select>

  <button class="flex items-center btn-primary" id="new-entry-btn">
    <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    New Entry
  </button>
</div>

<div class="register-wrap">
  <div class="flex register-table">
    <div class="flex margin-col" id="margin-col">
      <div class="margin-col-head"></div>
    </div>
    <div class="table-scroll">
      <div class="table-inner">
        <div class="flex items-center table-head">
          <div class="col-gr">GR No.</div>
          <div class="col-name">Petitioner</div>
          <div class="col-village">Village / Ward</div>
          <div class="col-category">Category</div>
          <div class="col-status">Status</div>
          <div class="col-chevron"></div>
        </div>
        <div id="table-body"></div>
      </div>
    </div>
  </div>
</div>

<!-- New Entry Modal -->
<div class="overlay flex modal-center hidden" id="form-overlay">
  <form class="modal-card" id="grievance-form">
    <div class="flex items-center justify-between" style="margin-bottom:16px;">
      <div class="modal-title">File a New Grievance</div>
      <button type="button" class="icon-btn" id="close-form-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A5670" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div style="margin-bottom:12px;">
      <label class="field-label">Petitioner Name</label>
      <input required class="field-input" id="f-name" type="text" />
    </div>
    <div style="margin-bottom:12px;">
      <label class="field-label">Village / Ward</label>
      <input required class="field-input" id="f-village" type="text" />
    </div>

    <div class="flex gap-3" style="margin-bottom:12px;">
      <div style="flex:1;">
        <label class="field-label">Category</label>
        <select class="field-input" id="f-category"></select>
      </div>
      <div style="flex:1;">
        <label class="field-label">Priority</label>
        <select class="field-input" id="f-priority">
          <option>Low</option><option selected>Medium</option><option>High</option>
        </select>
      </div>
    </div>

    <div style="margin-bottom:12px;">
      <label class="field-label">Date Filed</label>
      <input required class="field-input" id="f-date" type="date" />
    </div>

    <div style="margin-bottom:20px;">
      <label class="field-label">Grievance Description</label>
      <textarea required class="field-input" id="f-description" rows="3"></textarea>
    </div>

    <button type="submit" class="btn-primary" style="width:100%;">Register Grievance</button>
  </form>
</div>

<!-- Detail Drawer -->
<div class="overlay hidden" id="drawer-overlay">
  <div class="drawer" id="drawer-content"></div>
</div>

<script>
  const CATEGORIES = ["Water Supply","Roads & Infrastructure","Sanitation & Waste","Street Light","Electricity","Land Dispute","Public Health","Other"];
  const STATUSES = ["Pending","In Progress","Resolved"];

  let grievances = [
    { id:"GR-2026-001", name:"Muthulakshmi R.", village:"Ward 3 - Keezhapatti", category:"Water Supply", priority:"High",
      description:"No piped water supply for the past 9 days near the bus stop lane.", filedDate:"2026-07-12",
      status:"In Progress", officer:"Selvam K., Junior Engineer", notes:"Tanker arranged twice; pipeline repair work in progress.", resolvedDate:null },
    { id:"GR-2026-002", name:"Anbarasan T.", village:"Ward 1 - Main Street", category:"Roads & Infrastructure", priority:"Medium",
      description:"Large pothole near the school gate causing accidents during rain.", filedDate:"2026-07-08",
      status:"Resolved", officer:"Vetri M., Panchayat Overseer", notes:"Pothole filled and road patched on 18 July 2026.", resolvedDate:"2026-07-18" },
    { id:"GR-2026-003", name:"Kamatchi S.", village:"Ward 5 - Kovil Street", category:"Street Light", priority:"Low",
      description:"Two street lights not working since last month, unsafe at night.", filedDate:"2026-07-20",
      status:"Pending", officer:"Not yet assigned", notes:"", resolvedDate:null },
    { id:"GR-2026-004", name:"Palanivel G.", village:"Ward 2 - Therku Theru", category:"Sanitation & Waste", priority:"High",
      description:"Garbage not collected for two weeks, waste piling near the community well.", filedDate:"2026-07-15",
      status:"Pending", officer:"Not yet assigned", notes:"", resolvedDate:null }
  ];

  let query = "";
  let statusFilter = "All";
  let categoryFilter = "All";
  let selectedId = null;

  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => document.querySelectorAll(sel);

  function nextGrNumber() {
    const year = new Date().getFullYear();
    const nums = grievances
      .filter(g => g.id.includes(String(year)))
      .map(g => parseInt(g.id.split("-")[2], 10))
      .filter(n => !isNaN(n));
    const next = (nums.length ? Math.max(...nums) : 0) + 1;
    return "GR-" + year + "-" + String(next).padStart(3, "0");
  }

  function stampClass(status) {
    if (status === "Pending") return "stamp stamp-pending";
    if (status === "In Progress") return "stamp stamp-progress";
    return "stamp stamp-resolved";
  }

  function priorityClass(p) {
    if (p === "High") return "priority-dot priority-high";
    if (p === "Medium") return "priority-dot priority-medium";
    return "priority-dot priority-low";
  }

  function iconClock(size, color) {
    return '<svg class="icon" width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
  }
  function iconCheck(size, color) {
    return '<svg class="icon" width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
  }
  function iconMapPin(size, color) {
    return '<svg class="icon" width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>';
  }
  function iconClipboard(size, color) {
    return '<svg class="icon" width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>';
  }
  function iconCalendar(size, color) {
    return '<svg class="icon" width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>';
  }
  function iconAlert(size, color) {
    return '<svg class="icon" width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
  }
  function iconChevron(size, color) {
    return '<svg class="icon" width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>';
  }

  function populateCategorySelects() {
    const filterSel = $("#category-filter");
    const formSel = $("#f-category");
    CATEGORIES.forEach(c => {
      const o1 = document.createElement("option"); o1.value = c; o1.textContent = c;
      filterSel.appendChild(o1);
      const o2 = document.createElement("option"); o2.value = c; o2.textContent = c;
      formSel.appendChild(o2);
    });
  }

  function getFiltered() {
    const q = query.trim().toLowerCase();
    return grievances.filter(g => {
      const matchesQuery = !q || g.name.toLowerCase().includes(q) || g.village.toLowerCase().includes(q) || g.id.toLowerCase().includes(q);
      const matchesStatus = statusFilter === "All" || g.status === statusFilter;
      const matchesCategory = categoryFilter === "All" || g.category === categoryFilter;
      return matchesQuery && matchesStatus && matchesCategory;
    });
  }

  function renderStats() {
    const total = grievances.length;
    const pending = grievances.filter(g => g.status === "Pending").length;
    const progress = grievances.filter(g => g.status === "In Progress").length;
    const resolved = grievances.filter(g => g.status === "Resolved").length;
    const rate = total ? Math.round((resolved / total) * 100) : 0;
    $("#stat-total").textContent = total;
    $("#stat-pending").textContent = pending;
    $("#stat-progress").textContent = progress;
    $("#stat-resolved").textContent = resolved;
    $("#stat-rate").textContent = rate + "%";
  }

  function renderTable() {
    const filtered = getFiltered();
    const marginCol = $("#margin-col");
    const body = $("#table-body");

    marginCol.innerHTML = '<div class="margin-col-head"></div>';
    body.innerHTML = "";

    if (filtered.length === 0) {
      body.innerHTML = '<div class="empty-state">No entries match this search. Try a different name, village or filter.</div>';
      return;
    }

    filtered.forEach((g, i) => {
      const num = document.createElement("div");
      num.className = "flex items-center justify-center margin-number";
      num.textContent = String(i + 1).padStart(2, "0");
      marginCol.appendChild(num);

      const row = document.createElement("div");
      row.className = "flex items-center ledger-row";
      row.tabIndex = 0;
      row.innerHTML =
        '<div class="col-gr cell-gr">' + g.id + '</div>' +
        '<div class="col-name flex items-center cell-name"><span class="' + priorityClass(g.priority) + '" title="' + g.priority + ' priority"></span>' + g.name + '</div>' +
        '<div class="col-village cell-village">' + g.village + '</div>' +
        '<div class="col-category cell-category">' + g.category + '</div>' +
        '<div class="col-status">' + statusStampHtml(g.status) + '</div>' +
        '<div class="col-chevron flex items-center">' + iconChevron(16, "#4A5670") + '</div>';
      row.addEventListener("click", () => openDrawer(g.id));
      row.addEventListener("keydown", (e) => { if (e.key === "Enter") openDrawer(g.id); });
      body.appendChild(row);
    });
  }

  function statusStampHtml(status) {
    const label = status === "In Progress" ? "IN PROGRESS" : status.toUpperCase();
    return '<span class="' + stampClass(status) + '">' + label + '</span>';
  }

  function renderAll() {
    renderStats();
    renderTable();
  }

  // Toolbar events
  $("#search-input").addEventListener("input", (e) => { query = e.target.value; renderTable(); });
  $("#status-filter").addEventListener("change", (e) => { statusFilter = e.target.value; renderTable(); });
  $("#category-filter").addEventListener("change", (e) => { categoryFilter = e.target.value; renderTable(); });

  // New entry modal
  $("#new-entry-btn").addEventListener("click", () => {
    $("#f-date").value = new Date().toISOString().slice(0, 10);
    $("#form-overlay").classList.remove("hidden");
  });
  $("#close-form-btn").addEventListener("click", () => $("#form-overlay").classList.add("hidden"));
  $("#form-overlay").addEventListener("click", (e) => { if (e.target.id === "form-overlay") $("#form-overlay").classList.add("hidden"); });

  $("#grievance-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const entry = {
      id: nextGrNumber(),
      name: $("#f-name").value.trim(),
      village: $("#f-village").value.trim(),
      category: $("#f-category").value,
      priority: $("#f-priority").value,
      description: $("#f-description").value.trim(),
      filedDate: $("#f-date").value,
      status: "Pending",
      officer: "Not yet assigned",
      notes: "",
      resolvedDate: null
    };
    if (!entry.name || !entry.village || !entry.description) return;
    grievances.unshift(entry);
    e.target.reset();
    $("#form-overlay").classList.add("hidden");
    renderAll();
  });

  // Detail drawer
  function openDrawer(id) {
    selectedId = id;
    renderDrawer();
    $("#drawer-overlay").classList.remove("hidden");
  }
  function closeDrawer() {
    selectedId = null;
    $("#drawer-overlay").classList.add("hidden");
  }
  $("#drawer-overlay").addEventListener("click", (e) => { if (e.target.id === "drawer-overlay") closeDrawer(); });

  function renderDrawer() {
    const g = grievances.find(x => x.id === selectedId);
    if (!g) return;
    const content = $("#drawer-content");

    let resolvedLine = "";
    if (g.resolvedDate) {
      resolvedLine = '<div class="flex items-center gap-2">' + iconCheck(14, "#4A5670") + ' Resolved on ' + g.resolvedDate + '</div>';
    }

    content.innerHTML =
      '<div class="flex items-center justify-between" style="margin-bottom:4px;">' +
        '<div class="drawer-id">' + g.id + '</div>' +
        '<button class="icon-btn" id="drawer-close-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A5670" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>' +
      '</div>' +
      '<div class="drawer-name">' + g.name + '</div>' +
      '<div class="flex flex-col drawer-meta">' +
        '<div class="flex items-center gap-2">' + iconMapPin(14, "#4A5670") + ' ' + g.village + '</div>' +
        '<div class="flex items-center gap-2">' + iconClipboard(14, "#4A5670") + ' ' + g.category + '</div>' +
        '<div class="flex items-center gap-2">' + iconCalendar(14, "#4A5670") + ' Filed on ' + g.filedDate + '</div>' +
        '<div class="flex items-center gap-2">' + iconAlert(14, "#4A5670") + ' ' + g.priority + ' priority</div>' +
        resolvedLine +
      '</div>' +
      '<div style="margin-bottom:16px;">' + statusStampHtml(g.status) + '</div>' +
      '<div class="drawer-desc">' + g.description + '</div>' +
      '<div style="margin-bottom:12px;">' +
        '<label class="field-label">Assigned Officer</label>' +
        '<input class="field-input" id="d-officer" value="' + (g.officer || "").replace(/"/g,'&quot;') + '" placeholder="e.g. Selvam K., Junior Engineer" />' +
      '</div>' +
      '<div style="margin-bottom:16px;">' +
        '<label class="field-label">Resolution Notes</label>' +
        '<textarea class="field-input" id="d-notes" rows="3" placeholder="Action taken so far...">' + (g.notes || "") + '</textarea>' +
      '</div>' +
      '<label class="field-label" style="margin-bottom:6px;">Update Status</label>' +
      '<div class="flex gap-2 flex-wrap" id="status-btns" style="margin-bottom:8px;"></div>';

    $("#drawer-close-btn").addEventListener("click", closeDrawer);

    const statusBtnWrap = $("#status-btns");
    STATUSES.forEach(s => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "status-btn" + (g.status === s ? " active" : "");
      const icon = s === "Resolved" ? iconCheck(13, g.status === s ? "white" : "#1C2B45") : iconClock(13, g.status === s ? "white" : "#1C2B45");
      btn.innerHTML = icon + " " + s;
      btn.addEventListener("click", () => updateStatus(s));
      statusBtnWrap.appendChild(btn);
    });
  }

  function updateStatus(newStatus) {
    const g = grievances.find(x => x.id === selectedId);
    if (!g) return;
    g.officer = $("#d-officer").value;
    g.notes = $("#d-notes").value;
    g.status = newStatus;
    g.resolvedDate = newStatus === "Resolved" ? new Date().toISOString().slice(0, 10) : null;
    renderDrawer();
    renderAll();
  }

  populateCategorySelects();
  renderAll();
</script>
</body>
</html>
